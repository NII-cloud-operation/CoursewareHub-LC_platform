name: Build and push Docker images

on:
  push:
    paths:
      - 'jupyterhub/**'
      - 'auth-proxy/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      export_for_e2e:
        description: Load the images locally and export them for the deployment tests
        required: true
        type: boolean

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Select image tags
        id: tags
        env:
          EXPORT_FOR_E2E: ${{ inputs.export_for_e2e }}
          DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_NAMESPACE }}
        run: |
          if [[ "$EXPORT_FOR_E2E" == "true" ]]; then
            echo "tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
            echo "prefix=$DOCKERHUB_NAMESPACE/" >> "$GITHUB_OUTPUT"
          fi
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to DockerHub
        if: ${{ ! inputs.export_for_e2e }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: "Build: jupyterhub"
        uses: docker/build-push-action@v7
        with:
          context: ./jupyterhub/
          push: ${{ ! inputs.export_for_e2e }}
          load: ${{ inputs.export_for_e2e == true }}
          tags: "${{ steps.tags.outputs.prefix }}coursewarehub-jupyterhub:${{ steps.tags.outputs.tag }}"
      -
        name: "Build: auth-proxy"
        uses: docker/build-push-action@v7
        with:
          context: ./auth-proxy/
          push: ${{ ! inputs.export_for_e2e }}
          load: ${{ inputs.export_for_e2e == true }}
          tags: "${{ steps.tags.outputs.prefix }}coursewarehub-auth-proxy:${{ steps.tags.outputs.tag }}"
          build-args: |
            ATTRIBUTE_AGGREGATOR_URL=${{ vars.ATTRIBUTE_AGGREGATOR_URL || 'https://github.com/NII-cloud-operation/simplesamlphp-module-attributeaggregator' }}
            ATTRIBUTE_AGGREGATOR_BRANCH=${{ vars.ATTRIBUTE_AGGREGATOR_BRANCH || 'dev-2.x-gakunin-cloud-gateway' }}
      - name: Export the built images for deployment
        if: inputs.export_for_e2e
        run: |
          docker save "coursewarehub-jupyterhub:$GITHUB_SHA" "coursewarehub-auth-proxy:$GITHUB_SHA" | zstd -T0 -1 -o "$RUNNER_TEMP/platform.tar.zst"
      - uses: actions/upload-artifact@v4
        if: inputs.export_for_e2e
        with:
          name: platform-images
          path: ${{ runner.temp }}/platform.tar.zst
          compression-level: 0
          retention-days: 1
          overwrite: true
